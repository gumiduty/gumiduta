<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея | Дари Полісся</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="mobile-header">
    <button class="burger-icon" onclick="toggleMenu()">☰</button>
    <div class="header-title">Галерея</div>
    <button class="theme-icon-mobile" onclick="toggleTheme()">☀</button>
</header>

<nav class="sidebar" id="sidebar">
    <div class="user-profile">
        <img src="img/logo.jpg" alt="Логотип">
        <h3>Дари Полісся</h3>
    </div>
    <div class="menu">
        <a href="index.html">ГОЛОВНА</a>
        <div class="dropdown">
            <a href="#">КАТАЛОГ ▾</a>
            <div class="dropdown-container">
                <a href="mushrooms.html">Гриби сушені</a>
                <a href="berries.html">Ягоди лісові</a>
            </div>
        </div>
        <a href="gallery.html" class="active">ГАЛЕРЕЯ</a>
        <a href="about.html">ПРО НАС</a>
        <a href="contacts.html">КОНТАКТИ</a>
        <button class="theme-toggle-btn" onclick="toggleTheme()">Змінити тему</button>
    </div>
</nav>

<main class="main-content">
    <h1>Життя нашого виробництва</h1>
    <hr>
    
    <div class="gallery-grid">
        <figure class="card-item">
            <img src="img/foto1.jpg" alt="Ліс ранок">
            <figcaption style="padding:15px; font-style:italic;">Ранок у Сарненському лісі</figcaption>
        </figure>
        <figure class="card-item">
            <img src="img/foto2.jpg" alt="Збір ягід">
            <figcaption style="padding:15px; font-style:italic;">Ручний збір чорниці</figcaption>
        </figure>
        <figure class="card-item">
            <img src="img/foto3.jpg" alt="Сушарка">
            <figcaption style="padding:15px; font-style:italic;">Процес сортування перед сушкою</figcaption>
        </figure>
        <figure class="card-item">
            <img src="img/foto4.jpg" alt="Пасіка">
            <figcaption style="padding:15px; font-style:italic;">Лісова пасіка наших партнерів</figcaption>
        </figure>
    </div>

    <footer>
        <hr>
        <p>Матвійчук Ірина.</p>
    </footer>
</main>

<script>
function toggleMenu() {
    var sb = document.getElementById("sidebar");
    if (sb.style.display === "block") { sb.style.display = "none"; } else { sb.style.display = "block"; }
}
function toggleTheme() {
    document.body.classList.toggle("dark-mode");
}
</script>

</body>
</html>
